# Автоматическая сборка и публикация сайта на GitHub Pages.
# Запускается при каждом push в ветку main (или вручную: Actions → Run workflow).

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Права, которые нужны для публикации в Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум публикациям идти одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать проект
        run: npm run build

      - name: Подготовить настройки Pages
        uses: actions/configure-pages@v5

      - name: Загрузить папку dist как артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
